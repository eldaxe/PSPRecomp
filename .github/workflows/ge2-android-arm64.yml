name: GE2 Android ARM64 scaffold

on:
  push:
    branches:
      - main
      - feature/ge2-android-arm64
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "profiles/ge2/**"
      - ".github/workflows/ge2-android-arm64.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "profiles/ge2/**"
      - ".github/workflows/ge2-android-arm64.yml"
  workflow_dispatch:

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018"

      - name: Validate profile helper scripts
        run: |
          sh -n profiles/ge2/scripts/analyze_local.sh
          sh -n profiles/ge2/scripts/build_android.sh
          python3 -m py_compile profiles/ge2/scripts/audit_report.py

      - name: Configure native profile
        run: |
          cmake -S . -B out/ge2-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DPSPRECOMP_PROFILE=ge2 \
            -DPSPRECOMP_BUILD_TESTS=OFF \
            -DPSPRECOMP_BUILD_PROFILE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build native profile
        run: cmake --build out/ge2-android-arm64 --target ge2_native

      - name: Build Android APK
        run: gradle -p profiles/ge2/android --no-daemon assembleDebug

      - name: Verify APK contains ARM64 native library
        run: |
          APK=profiles/ge2/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libge2_native.so'
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ge2-native-android-arm64-debug
          path: profiles/ge2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
